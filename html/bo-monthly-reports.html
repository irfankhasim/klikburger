<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TAB KAUNTER" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/ios-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/ios-icon-precomposed.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ios-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/ios-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/ios-icon-152.png" />
    <title>Laporan Perniagaan — Tab Kaunter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/bo-monthly-reports.css" />
    <script>
      try { if (window.self !== window.parent) { document.documentElement.classList.add("kb-embed"); } } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/i18n-toggle.css" />
    <link rel="stylesheet" href="../css/kb-modal.css" />
  </head>
  <body class="staff-dash" data-i18n-doc-title="report.docTitle">
    <div class="mr-app" id="mr-root">

      <header class="mr-header kb-page-header">
        <h1 class="sr-only" data-i18n="report.heading">Laporan Perniagaan</h1>
      </header>

      <section class="mr-toolbar" data-i18n-aria-label="report.filtersLabel" aria-label="Penapis laporan">
        <div class="mr-toolbar__row">
          <div class="mr-field">
            <span class="mr-field__label" data-i18n="report.year">Tahun</span>
            <select id="mr-year" class="mr-select"></select>
          </div>
          <div class="mr-field">
            <span class="mr-field__label" data-i18n="report.monthField">Bulan</span>
            <select id="mr-month" class="mr-select"></select>
          </div>
          <div class="mr-toolbar__actions">
            <button type="button" class="btn btn--primary" id="mr-generate">
              <i class="fa-solid fa-file-circle-plus" aria-hidden="true"></i> <span data-mr-label="generate">Jana laporan</span>
            </button>
            <button type="button" class="btn btn--primary" id="mr-download-pdf" disabled>
              <i class="fa-solid fa-file-pdf" aria-hidden="true"></i> <span data-mr-label="downloadPdf">Muat turun PDF</span>
            </button>
          </div>
        </div>
      </section>

      <p id="mr-status" class="mr-status mr-status--hidden" role="status" aria-live="polite"></p>

      <div id="mr-report-body"></div>

    </div>
    <script type="module" src="../js/bo-monthly-reports-app.js?v=55"></script>
    <link rel="stylesheet" href="../css/ai-floating-widget.css" />
    <script type="module" src="../js/ai-assistant/global-widget-bootstrap.js"></script>
    <script type="module" src="../js/i18n/lang-toggle.js"></script>
  </body>
</html>
