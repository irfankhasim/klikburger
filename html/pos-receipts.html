<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Resit — Klik Burger</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pos-ops-shared.css" />
    <style>
      .refund-backdrop {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(26, 26, 26, 0.45);
        overflow-y: auto;
      }
      .refund-backdrop[hidden] {
        display: none !important;
      }
      .refund-modal-box {
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        width: 100%;
        max-width: 420px;
        margin: auto;
      }
      .refund-modal-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .refund-modal-head h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
      }
      #btn-refund-close {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        color: var(--text-muted);
        padding: 4px;
        line-height: 1;
      }
      .refund-modal-body {
        padding: 16px 20px;
      }
      .refund-modal-foot {
        padding: 14px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .refund-info-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }
      .refund-modal-body .field {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .refund-modal-body .field label {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--text-muted);
      }
      .refund-modal-body .field input {
        width: 100%;
        padding: 0.55rem 0.65rem;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--text);
      }
      .refund-modal-body .kb-status {
        margin: 12px 0 0;
        padding: 0.55rem 0.7rem;
        font-size: 0.82rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface-muted);
        color: var(--text);
      }
      .refund-modal-body .kb-status--hidden {
        display: none !important;
      }
      .refund-modal-body .kb-status--error {
        border-color: #e8a0a0;
        background: #fff5f5;
        color: #7a1f1f;
      }
      .refund-modal-body .kb-status--ok {
        border-color: #a8d4a8;
        background: #f4fff4;
        color: #1e4d1e;
      }
      .rc-btn--refund {
        background: var(--warning) !important;
        color: #fff !important;
        border: none !important;
      }
      .rc-btn--refund:disabled {
        opacity: 0.45;
      }
      .refund-modal-foot .btn {
        width: auto;
        margin-top: 0;
      }
      .refund-modal-foot .btn--warning {
        background: var(--warning);
        color: #fff;
        border: 1px solid var(--warning);
      }
      .refund-modal-foot .btn--warning:hover:not(:disabled) {
        opacity: 0.92;
      }
      .refund-modal-foot .btn--warning:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
    </style>
    <script>
      try {
        if (window.self !== window.parent) document.documentElement.classList.add("kb-embed");
      } catch (e) {}
    </script>
  </head>
  <body class="rc-body">
    <div class="rc-page ops-app">
      <p id="rc-rbac-banner" class="rc-rbac-banner" hidden role="status"></p>

      <!-- Utama: senarai resit dahulu (kerja pantas kaunter) -->
      <section class="rc-primary" aria-label="Senarai resit">
        <span id="rc-count" class="sr-only" aria-live="polite" aria-atomic="true"></span>
        <div class="rc-filters">
          <div class="rc-filters__search">
            <label class="sr-only" for="rc-search">Cari</label>
            <span class="rc-filters__icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="search" id="rc-search" class="rc-input rc-input--search" placeholder="No. resit / pesanan" autocomplete="off" />
          </div>
          <div class="rc-filters__pay">
            <label for="rc-filter-pay">Bayaran</label>
            <select id="rc-filter-pay" class="rc-input rc-input--select">
              <option value="">Semua</option>
              <option value="cash">Tunai</option>
              <option value="qr">QR</option>
            </select>
          </div>
        </div>
        <div id="rc-list" class="rc-receipt-list" role="list"></div>
      </section>
    </div>

    <div id="rc-drawer-back" class="ops-drawer-backdrop" aria-hidden="true"></div>
    <aside id="rc-drawer" class="ops-drawer rc-drawer" aria-hidden="true" aria-labelledby="rc-drawer-title">
      <div class="ops-drawer__head rc-drawer__head">
        <div>
          <h2 id="rc-drawer-title" class="rc-drawer__title">Resit</h2>
          <p id="rc-drawer-sub" class="rc-drawer__sub"></p>
        </div>
        <button type="button" class="rc-btn rc-btn--line rc-btn--icon btn-close-x" id="rc-drawer-close" aria-label="Tutup">✕</button>
      </div>
      <div class="ops-drawer__body rc-drawer__body" id="rc-drawer-body"></div>
    </aside>

    <div id="refund-modal" class="refund-backdrop" hidden aria-hidden="true">
      <div class="refund-modal-box" role="dialog" aria-modal="true" aria-labelledby="refund-modal-title">
        <div class="refund-modal-head">
          <h2 id="refund-modal-title">Pemulangan wang (Refund)</h2>
          <button type="button" class="btn-close-x" id="btn-refund-close" aria-label="Tutup">✕</button>
        </div>

        <div class="refund-modal-body">
          <div class="refund-info-row">
            <span>No. Resit</span>
            <strong id="refund-receipt-no">—</strong>
          </div>
          <div class="refund-info-row">
            <span>Jumlah refund</span>
            <strong id="refund-amount" style="color:var(--warning)">RM 0.00</strong>
          </div>
          <div class="refund-info-row">
            <span>Kaedah</span>
            <span id="refund-pm">—</span>
          </div>

          <div class="field">
            <label for="refund-note">Sebab refund</label>
            <input type="text" id="refund-note" placeholder="Contoh: Pesanan salah, pelanggan tidak berpuas hati" />
          </div>

          <p id="refund-status" class="kb-status kb-status--hidden"></p>
        </div>

        <div class="refund-modal-foot">
          <button type="button" class="btn btn--ghost" id="btn-refund-cancel">Batal</button>
          <button type="button" class="btn btn--warning" id="btn-refund-confirm">Sahkan refund</button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/pos-receipts-app.js"></script>
    <link rel="stylesheet" href="../css/ai-floating-widget.css" />
    <script type="module" src="../js/ai-assistant/global-widget-bootstrap.js"></script>
  </body>
</html>
